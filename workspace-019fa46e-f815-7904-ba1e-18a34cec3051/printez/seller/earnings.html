<!DOCTYPE html>
<html lang="en">
<head>
<title>Seller · Earnings</title>
<link rel="stylesheet" href="../assets/css/app.css"/>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
</head>
<body>
<div class="shell"><div id="sidebar"></div><main class="main">
  <button id="mobile-toggle" class="btn btn-outline mobile-toggle" style="margin-bottom:10px">☰ Menu</button>
  <div id="content"></div>
</main></div>
<script src="../assets/js/app.js"></script>
<script>
pageLoaded();
if(!requireAuth('seller')){} else render();
let range='30';
function render(){
  document.getElementById('sidebar').innerHTML = renderSellerSidebar('earnings');
  bindSellerShell();
  const shop=Data.shopById(Auth.seller().shopId);
  const days = parseInt(range);
  const since = new Date(Date.now()-days*86400000);
  const orders = Data.orders().filter(o=>o.shopId===shop.id && new Date(o.createdAt)>=since);
  const delivered = orders.filter(o=>o.status==='delivered');
  const earned = delivered.reduce((s,o)=>s+o.shopPayoutAmount,0);
  const gmv = orders.reduce((s,o)=>s+o.totalAmount,0);
  const pending = orders.filter(o=>o.status!=='delivered').reduce((s,o)=>s+o.shopPayoutAmount,0);

  document.getElementById('content').innerHTML = `
    <h1 style="font-size:24px;font-weight:800">Earnings</h1>
    <p class="muted text-sm mb-16">Your payouts after platform commission (15% print, 25% gifting).</p>

    <div class="tabs mb-16" style="margin-bottom:16px">
      ${[['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days'],['all','All time']].map(([v,l])=>`
        <button class="tab ${range===v?'active':''}" data-r="${v}">${l}</button>`).join('')}
    </div>

    <div class="grid-stats">
      <div class="stat" style="background:linear-gradient(135deg,#059669,#047857);color:#fff;border:none">
        <div class="lbl" style="color:#bbf7d0">Earned (paid out)</div>
        <div class="val" style="color:#fff">${inr(earned)}</div>
        <div class="sub" style="color:#bbf7d0">${delivered.length} delivered orders</div>
      </div>
      <div class="stat"><div class="lbl">In pipeline</div><div class="val">${inr(pending)}</div><div class="sub">from active orders</div></div>
      <div class="stat"><div class="lbl">GMV processed</div><div class="val">${inr(gmv)}</div><div class="sub">order value</div></div>
      <div class="stat"><div class="lbl">Average order</div><div class="val">${delivered.length?inr(gmv/orders.length):'—'}</div></div>
    </div>

    <h2 class="section-title">Recent payouts</h2>
    ${delivered.length===0?`<div class="card card-pad empty"><div class="ic">💰</div><h3>No payouts yet</h3><p>Completed orders appear here as payouts.</p></div>`:
    `<div class="table-wrap"><table class="data">
      <thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Date</th><th style="text-align:right">Payout</th></tr></thead>
      <tbody>${delivered.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(o=>{
        const p=Data.productById(o.productId);
        return `<tr><td class="font-mono text-xs">${o.id}</td><td>${o.customerName}</td><td>${p.name} × ${o.quantity}</td><td class="text-xs muted">${fmtDateShort(o.createdAt)}</td><td style="text-align:right;font-weight:700;color:#059669">${inr(o.shopPayoutAmount)}</td></tr>`;
      }).join('')}</tbody></table></div>`}
    <div style="height:40px"></div>`;
  document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{range=b.dataset.r;render();}));
}
</script>
</body>
</html>
