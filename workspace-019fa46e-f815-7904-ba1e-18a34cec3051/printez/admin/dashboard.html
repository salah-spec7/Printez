<!DOCTYPE html>
<html lang="en">
<head>
<title>Admin · Overview</title>
<link rel="stylesheet" href="../assets/css/app.css"/>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
</head>
<body><div class="shell"><div id="sidebar"></div><main class="main">
  <button id="mobile-toggle" class="btn btn-outline mobile-toggle" style="margin-bottom:10px">☰ Menu</button>
  <div id="content"></div>
</main></div>
<script src="../assets/js/app.js"></script>
<script>
pageLoaded();
if(!requireAuth('admin')){} else render();
function render(){
  document.getElementById('sidebar').innerHTML = renderAdminSidebar('dashboard');
  bindAdminShell();
  const orders = Data.orders();
  const shops = Data.shops();
  const gmv = orders.reduce((s,o)=>s+o.totalAmount,0);
  const comm = orders.reduce((s,o)=>s+o.commissionAmount,0);
  const pendingShops = shops.filter(s=>s.status==='pending').length;
  const unassigned = orders.filter(o=>!o.shopId).length;
  const flagged = shops.filter(s=>s.avgRating!=null && s.avgRating<3.5).length;
  const delivered = orders.filter(o=>o.status==='delivered').length;

  document.getElementById('content').innerHTML = `
    <h1 style="font-size:24px;font-weight:800">Overview</h1>
    <p class="muted text-sm mb-16">Snapshot of the printez marketplace in Kharghar.</p>
    <div class="grid-stats">
      <div class="stat" style="background:linear-gradient(135deg,#4f46e5,#4338ca);color:#fff;border:none"><div class="lbl" style="color:#c7d2fe">Total GMV</div><div class="val" style="color:#fff">${inr(gmv)}</div></div>
      <div class="stat"><div class="lbl">Commission earned</div><div class="val" style="color:#059669">${inr(comm)}</div><div class="sub">from ${orders.length} orders</div></div>
      <div class="stat"><div class="lbl">Approved shops</div><div class="val">${shops.filter(s=>s.status==='approved').length}</div></div>
      <div class="stat"><div class="lbl">Orders delivered</div><div class="val" style="color:var(--good)">${delivered}</div></div>
    </div>
    <div class="grid-stats mt-16" style="margin-top:16px">
      <a href="shops.html" class="stat" style="text-decoration:none;color:inherit"><div class="lbl">🏪 Pending approvals</div><div class="val" style="color:${pendingShops?'#b91c1c':'var(--ink-900)'}">${pendingShops}</div><div class="sub">${pendingShops?'Action needed':'All caught up'}</div></a>
      <a href="assign.html" class="stat" style="text-decoration:none;color:inherit"><div class="lbl">🔀 Unassigned orders</div><div class="val" style="color:${unassigned?'#b91c1c':'var(--ink-900)'}">${unassigned}</div></a>
      <a href="quality.html" class="stat" style="text-decoration:none;color:inherit"><div class="lbl">⭐ Flagged shops</div><div class="val" style="color:${flagged?'#b91c1c':'var(--good)'}">${flagged}</div></a>
      <a href="products.html" class="stat" style="text-decoration:none;color:inherit"><div class="lbl">🛍️ Catalog SKUs</div><div class="val">${Data.products().length}</div></a>
    </div>

    <h2 class="section-title">Recent orders<span class="sub"><a href="orders.html" class="text-sm" style="color:var(--brand-700);font-weight:600">See all →</a></span></h2>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Shop</th><th>Status</th><th style="text-align:right">Total</th></tr></thead>
      <tbody>${orders.slice(0,8).map(o=>{
        const p=Data.productById(o.productId), sh=Data.shopById(o.shopId);
        return `<tr><td class="font-mono text-xs">${o.id}</td><td>${o.customerName}</td><td>${p.name} × ${o.quantity}</td><td>${sh?sh.name:'<span style="color:#b91c1c;font-weight:600">Unassigned</span>'}</td><td><span class="badge ${STATUS_BADGE[o.status]}">${STATUS_LABEL[o.status]}</span></td><td style="text-align:right;font-weight:700">${inr(o.totalAmount)}</td></tr>`;
      }).join('')}</tbody></table></div>
    <div style="height:40px"></div>`;
}
</script>
</body>
</html>
