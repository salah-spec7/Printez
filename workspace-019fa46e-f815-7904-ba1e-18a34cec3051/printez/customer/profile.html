<!DOCTYPE html>
<html lang="en">
<head>
<title>Me</title>
<link rel="stylesheet" href="../assets/css/app.css"/>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#c2410c"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2410c'/%3E%3Ctext x='16' y='22' font-family='Inter' font-size='18' font-weight='800' text-anchor='middle' fill='white'%3Epz%3C/text%3E%3C/svg%3E"/>
</head>
<body>
<div id="app"></div><div id="nav"></div>
<script src="../assets/js/app.js"></script>
<script>
pageLoaded();
const c = Auth.customer();
function render(){
  if(!c){ location.href='login.html'; return; }
  const orders = Data.orders().filter(o=>o.customerId===c.id||o.customerPhone===c.phone);
  const delivered = orders.filter(o=>o.status==='delivered').length;
  const active = orders.length-delivered;
  document.getElementById('app').innerHTML = `
    ${renderTopbarCustomer()}
    <main class="container-med">
      <div class="card card-pad" style="margin-top:16px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--brand-50),#fff)">
        <div style="width:60px;height:60px;border-radius:50%;background:var(--brand-600);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800">${(c.name||'C')[0].toUpperCase()}</div>
        <div style="flex:1"><div style="font-weight:800;font-size:18px">${c.name||'Customer'}</div><div class="text-sm muted">+91 ${c.phone}</div></div>
      </div>

      <div class="grid-stats mt-16">
        <a href="orders.html" class="stat"><div class="lbl">Active orders</div><div class="val">${active}</div></a>
        <a href="orders.html" class="stat"><div class="lbl">Delivered</div><div class="val">${delivered}</div></a>
        <div class="stat"><div class="lbl">Address saved</div><div class="val" style="font-size:16px">${JSON.parse(localStorage.getItem('pz_addr_v1')||'{}').line?'Yes':'No'}</div></div>
        <div class="stat"><div class="lbl">Cart items</div><div class="val">${Data.cart().reduce((s,i)=>s+i.quantity,0)}</div></div>
      </div>

      <h2 class="section-title">Quick links</h2>
      <div style="display:flex;flex-direction:column;gap:6px">
        <a href="index.html" class="card card-pad flex-between" style="text-decoration:none">🛍️  Browse catalog <span class="muted">→</span></a>
        <a href="cart.html" class="card card-pad flex-between" style="text-decoration:none">🛒  Your cart <span class="muted">→</span></a>
        <a href="orders.html" class="card card-pad flex-between" style="text-decoration:none">📦  Track orders <span class="muted">→</span></a>
        <a href="../index.html" class="card card-pad flex-between" style="text-decoration:none">🔀  Switch portal <span class="muted">→</span></a>
      </div>

      <button id="logout" class="btn btn-outline btn-block mt-24" style="margin-top:24px">Log out</button>
      <div style="height:30px"></div>
    </main>`;
  document.getElementById('nav').innerHTML=renderBottomNavCustomer('me');
  bindCustomerShell();
  document.getElementById('logout').addEventListener('click',()=>{ Auth.clearCustomer(); toast('Logged out','success'); setTimeout(()=>location.href='login.html',400);});
}
render();
</script>
</body>
</html>
