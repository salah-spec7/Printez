function productById(id){ return PRODUCTS.find(p=>p.id===id); }
function shopById(id){ return SHOPS.find(s=>s.id===id); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function tierPrice(product, qty){
  let price = product.basePrice;
  for(const [t,p] of product.tiers){ if(qty>=t) price=p; }
  return price;
}
function commissionFor(total, category){
  // Print 15%, Gifting 25%
  return Math.round(total * (category==='print' ? 0.15 : 0.25));
}

function calcPrintPrice(product, opts){
  // opts: {quantity, materialIdx, sides, width, height}
  const q = Math.max(1, parseInt(opts.quantity)||1);
  let unitPrice = tierPrice(product, q);

  // material multiplier
  const matMult = [1, 1.25, 1.6, 1.8, 2.0]; // corresponds to variants.material index
  unitPrice *= matMult[opts.materialIdx||0];

  // sides multiplier
  if(product.variants.hasSides && opts.sides==='double') unitPrice *= 1.7;

  // area for custom-size print (stickers, banners)
  let area = 1;
  if(product.variants.customSize){
    if(product.id==='bnr'){
      const w = Math.max(0.5, parseFloat(opts.width)||1);
      const h = Math.max(0.5, parseFloat(opts.height)||1);
      area = Math.max(1, w*h);
    } else if(product.id==='stk'){
      const w = Math.max(0.5, parseFloat(opts.width)||2);
      const h = Math.max(0.5, parseFloat(opts.height)||2);
      area = (w*h)/9; // normalize to ~3x3" as 1 unit
      area = Math.max(0.5, area);
    }
  }
  return { unitPrice: unitPrice*area, quantity: q, total: unitPrice*area*q };
}

function toast(msg, kind='info'){
  const root = document.getElementById('toast-root');
  const colors = { info:'bg-ink-900', success:'bg-green-700', error:'bg-red-700' };
  const el = document.createElement('div');
  el.className = `${colors[kind]} text-white text-sm px-4 py-3 rounded-xl shadow-pop fade-in flex items-center gap-2`;
  el.innerHTML = `<span class="text-base">${kind==='success'?'✓':kind==='error'?'✕':'ⓘ'}</span><span>${msg}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity=0; setTimeout(()=>el.remove(),300); },2400);
}

function productArt(p, size=200){
  // lightweight SVG illustrations per product
  const palettes = { print:['#fff7ed','#fed7aa','#c2410c'], gift:['#fff1f2','#fecdd3','#be123c'] };
  const [bg,mid,fg] = palettes[p.category];
  const common = `<rect width="${size}" height="${size}" rx="16" fill="${bg}"/>`;
  let art = '';
  const cx = size/2, cy = size/2;
  switch(p.image){
    case 'card':
      art = `<rect x="${cx-55}" y="${cy-35}" width="110" height="70" rx="6" fill="white" stroke="${fg}" stroke-width="2"/>
             <rect x="${cx-45}" y="${cy-23}" width="50" height="5" rx="2" fill="${mid}"/>
             <rect x="${cx-45}" y="${cy-12}" width="80" height="4" rx="2" fill="${mid}"/>
             <rect x="${cx-45}" y="${cy-2}" width="60" height="4" rx="2" fill="${mid}"/>
             <circle cx="${cx+35}" cy="${cy+18}" r="8" fill="${fg}"/>`;
      break;
    case 'sticker':
      art = `<circle cx="${cx}" cy="${cy}" r="50" fill="white" stroke="${fg}" stroke-width="3" stroke-dasharray="4 3"/>
             <path d="M${cx-25} ${cy+10} Q${cx} ${cy-30} ${cx+25} ${cy+10}" fill="${fg}"/>
             <circle cx="${cx-15}" cy="${cy-5}" r="4" fill="white"/>
             <circle cx="${cx+15}" cy="${cy-5}" r="4" fill="white"/>`;
      break;
    case 'banner':
      art = `<rect x="${cx-70}" y="${cy-35}" width="140" height="50" fill="${fg}"/>
             <polygon points="${cx-70},${cy+15} ${cx-55},${cy+25} ${cx-70},${cy+35}" fill="${fg}"/>
             <polygon points="${cx+70},${cy+15} ${cx+55},${cy+25} ${cx+70},${cy+35}" fill="${fg}"/>
             <rect x="${cx-50}" y="${cy-20}" width="100" height="8" rx="2" fill="white"/>
             <rect x="${cx-40}" y="${cy-3}" width="80" height="6" rx="2" fill="${mid}"/>`;
      break;
    case 'flyer':
      art = `<rect x="${cx-40}" y="${cy-55}" width="80" height="110" rx="4" fill="white" stroke="${fg}" stroke-width="2"/>
             <rect x="${cx-32}" y="${cy-45}" width="64" height="22" rx="2" fill="${fg}"/>
             <rect x="${cx-32}" y="${cy-15}" width="50" height="4" rx="2" fill="${mid}"/>
             <rect x="${cx-32}" y="${cy-5}" width="64" height="4" rx="2" fill="${mid}"/>
             <rect x="${cx-32}" y="${cy+5}" width="55" height="4" rx="2" fill="${mid}"/>`;
      break;
    case 'mug':
      art = `<path d="M${cx-35} ${cy-30} L${cx-35} ${cy+30} Q${cx-35} ${cy+45} ${cx-15} ${cy+45} L${cx+20} ${cy+45} Q${cx+40} ${cy+45} ${cx+40} ${cy+30} L${cx+40} ${cy-30} Z" fill="white" stroke="${fg}" stroke-width="2"/>
             <path d="M${cx+40} ${cy-15} Q${cx+65} ${cy-15} ${cx+65} ${cy+10} Q${cx+65} ${cy+30} ${cx+40} ${cy+25}" fill="none" stroke="${fg}" stroke-width="3"/>
             <circle cx="${cx+5}" cy="${cy+10}" r="10" fill="${mid}"/>`;
      break;
    case 'frame':
      art = `<rect x="${cx-50}" y="${cy-40}" width="100" height="80" rx="4" fill="#7c2d12"/>
             <rect x="${cx-42}" y="${cy-32}" width="84" height="64" fill="${bg}"/>
             <circle cx="${cx-20}" cy="${cy-10}" r="12" fill="${fg}"/>
             <polygon points="${cx-25},${cy+25} ${cx-5},${cy-5} ${cx+25},${cy+25}" fill="${mid}"/>`;
      break;
    case 'greet':
      art = `<rect x="${cx-50}" y="${cy-35}" width="100" height="70" rx="4" fill="white" stroke="${fg}" stroke-width="2"/>
             <line x1="${cx}" y1="${cy-35}" x2="${cx}" y2="${cy+35}" stroke="${mid}" stroke-width="1.5"/>
             <path d="M${cx+25} ${cy-10} Q${cx+35} ${cy-20} ${cx+45} ${cy-10}" fill="none" stroke="${fg}" stroke-width="2"/>
             <circle cx="${cx+30}" cy="${cy-20}" r="3" fill="${fg}"/>
             <circle cx="${cx-30}" cy="${cy+10}" r="3" fill="${fg}"/>`;
      break;
    case 'tee':
      art = `<path d="M${cx-50} ${cy-30} L${cx-30} ${cy-45} L${cx-30} ${cy-35} L${cx+30} ${cy-35} L${cx+30} ${cy-45} L${cx+50} ${cy-30} L${cx+40} ${cy-5} L${cx+30} ${cy-5} L${cx+30} ${cy+50} L${cx-30} ${cy+50} L${cx-30} ${cy-5} L${cx-40} ${cy-5} Z" fill="white" stroke="${fg}" stroke-width="2"/>
             <text x="${cx}" y="${cy+20}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="16" fill="${fg}">pz</text>`;
      break;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${common}${art}</svg>`;
}

function tierActive(p, q){
  let idx=0;
  for(let i=0;i<p.tiers.length;i++){ if(q>=p.tiers[i][0]) idx=i; }
  return idx;
}
function livePrice(p){
  if(p.category==='print'){
    return calcPrintPrice(p, { quantity:CONFIG.quantity, materialIdx:CONFIG.materialIdx, sides:CONFIG.sides, width:CONFIG.width, height:CONFIG.height });
  } else {
    const unit = p.giftPrices[CONFIG.giftIdx];
    return { unitPrice:unit, quantity:CONFIG.quantity, total:unit*CONFIG.quantity };
  }
}
function updatePriceLabels(){
  const p = productById(STATE.currentPage.params.id);
  const price = livePrice(p);
  const tl = document.getElementById('total-label');
  const ul = document.getElementById('unit-label');
  const ql = document.getElementById('qty-label');
  if(!tl) return;
  tl.textContent = rupee(price.total);
  ul.textContent = `${rupee(price.unitPrice)} per ${p.unit}`;
  ql.textContent = `${price.quantity} ${p.unit}${price.quantity>1 && p.unit!=='sq.ft'?'s':''}${p.id==='bnr' && CONFIG.width && CONFIG.height ? ` (${CONFIG.width}×${CONFIG.height} ft)`:''}`;
  if(p.id==='bnr'){
    const area = (parseFloat(CONFIG.width)||0)*(parseFloat(CONFIG.height)||0);
    const al = document.getElementById('area-label');
    if(al) al.textContent = `Total area: ${area.toFixed(1)} sq.ft`;
  }
  // tier hint
  if(p.category==='print'){
    const hint = document.getElementById('tier-hint');
    if(hint){
      const next = p.tiers.find(t=>t[0]>CONFIG.quantity);
      hint.textContent = next ? `Add ${next[0]-CONFIG.quantity} more → ${rupee(next[1])}/${p.unit}` : 'Best tier applied 🎉';
    }
    // refresh active tier visuals
    document.querySelectorAll('.tier-chip').forEach(()=>{});
  }
}

function bindProduct(){
  const p = productById(STATE.currentPage.params.id);
  if(!p) return;
  const refresh = ()=>{ updatePriceLabels(); renderTierHighlight(p); };
  document.querySelectorAll('.cfg-in').forEach(el=>{
    el.addEventListener('input', ()=>{
      readConfig(p);
      refresh();
    });
    el.addEventListener('change', ()=>{ readConfig(p); refresh(); });
  });
  document.querySelectorAll('.side-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      CONFIG.sides = b.dataset.side;
      document.querySelectorAll('.side-btn').forEach(x=>x.className='side-btn cfg-in py-3 rounded-xl border font-semibold text-sm bg-white border-ink-200 text-ink-700');
      b.className='side-btn cfg-in py-3 rounded-xl border font-semibold text-sm bg-ink-900 text-white border-ink-900';
      refresh();
    });
  });
  document.querySelectorAll('input[name="gift-opt"]').forEach(r=>{
    r.addEventListener('change', ()=>{ CONFIG.giftIdx = parseInt(r.value); refresh(); bindProduct(); /* re-render to update card */

function bindCart(){
  document.querySelectorAll('.remove-item').forEach(b=>{
    b.addEventListener('click',()=>{
      STATE.cart.splice(parseInt(b.dataset.remove),1);
      render();
    });
  });
  const shop = document.getElementById('shop-now');
  if(shop) shop.addEventListener('click',()=>go('catalog'));
  const pay = document.getElementById('pay-now');
  if(pay){
    pay.addEventListener('click', ()=>{
      const name = document.getElementById('addr-name').value.trim() || 'Customer';
      const phone = document.getElementById('addr-phone').value.trim() || '';
      const line  = document.getElementById('addr-line').value.trim() || 'Kharghar, Navi Mumbai';
      const pickup = document.getElementById('pickup').checked;
      // Create orders
      const newIds = [];
      STATE.cart.forEach(it=>{
        const p = productById(it.productId);
        const total = it.lineTotal;
        const comm = commissionFor(total, p.category);
        // auto-assign to first eligible approved shop
        const eligible = SHOPS.filter(s=>s.status==='approved' && s.categories.includes(p.category));
        const shop = eligible[Math.floor(Math.random()*eligible.length)] || null;
        const o = {
          id: 'ORD-'+(1200+STATE.orders.length+newIds.length+1),
          customerName: name,
          phone,
          productId: p.id,
          shopId: shop?shop.id:null,
          specs: it.specs,
          quantity: it.quantity,
          totalAmount: it.lineTotal,
          commissionAmount: comm,
          shopPayoutAmount: it.lineTotal-comm,
          status: shop?'assigned':'placed',
          rating:null,
          address: pickup?'Pickup — will notify when ready':line,
          delivery: pickup?'pickup':'delivery',
          createdAt: new Date().toISOString()
        };
        STATE.orders.unshift(o);
        newIds.push(o.id);
      });
      STATE.cart = [];
      STATE.lastOrderId = newIds[0];
      toast('Payment successful 🎉', 'success');
      setTimeout(()=>go('tracking', {id:newIds[0]}), 400);
    });
  }
}

function bindSeller(){

function renderAdminCommission(){
  const today = new Date();
  const monthAgo = new Date(today); monthAgo.setDate(monthAgo.getDate()-30);
  const from = ADMIN_FILTERS.from || monthAgo.toISOString().slice(0,10);
  const to = ADMIN_FILTERS.to || today.toISOString().slice(0,10);
  const inRange = STATE.orders.filter(o=>{
    const d = new Date(o.createdAt);
    return d>=new Date(from) && d<=new Date(to+'T23:59:59');
  });
  const totalComm = inRange.reduce((s,o)=>s+o.commissionAmount,0);
  const totalGmv = inRange.reduce((s,o)=>s+o.totalAmount,0);
  const printComm = inRange.filter(o=>productById(o.productId).category==='print').reduce((s,o)=>s+o.commissionAmount,0);
  const giftComm  = inRange.filter(o=>productById(o.productId).category==='gifting').reduce((s,o)=>s+o.commissionAmount,0);

  // breakdown per shop
  const byShop = {};
  inRange.filter(o=>o.shopId).forEach(o=>{
    byShop[o.shopId] = byShop[o.shopId]||{orders:0,gmv:0,comm:0,payout:0};
    byShop[o.shopId].orders++;
    byShop[o.shopId].gmv+=o.totalAmount;
    byShop[o.shopId].comm+=o.commissionAmount;
    byShop[o.shopId].payout+=o.shopPayoutAmount;
  });
  const rows = Object.entries(byShop).map(([sid,v])=>({shop:shopById(sid), ...v})).sort((a,b)=>b.comm-a.comm);

  return `
    <h1 class="font-display text-2xl font-extrabold mb-1">Commission dashboard</h1>
    <p class="text-sm text-ink-500 mb-5">Print: <b>15%</b> · Gifting: <b>25%</b> platform fee on every order.</p>

      <div class="text-xs text-ink-500 flex items-center gap-1 md:justify-end">Last 30 days shown by default</div>
    </div>

      <div class="bg-gradient-to-br from-indigo-600 to-indigo-700 text-white rounded-2xl p-4 shadow-pop">
        <div class="text-xs font-semibold text-indigo-100">Total commission</div>
        <div class="font-display text-2xl font-extrabold mt-1">${rupee(totalComm)}</div>
      </div>
      <div class="bg-white rounded-2xl border border-ink-200 p-4 shadow-card">
        <div class="text-xs text-ink-500 font-semibold">GMV in range</div>
        <div class="font-display text-2xl font-extrabold mt-1">${rupee(totalGmv)}</div>
      </div>
      <div class="bg-white rounded-2xl border border-ink-200 p-4 shadow-card">
        <div class="text-xs text-ink-500 font-semibold">🖨️ Print comm. (15%)</div>
        <div class="font-display text-2xl font-extrabold mt-1">${rupee(printComm)}</div>
      </div>
      <div class="bg-white rounded-2xl border border-ink-200 p-4 shadow-card">
        <div class="text-xs text-ink-500 font-semibold">🎁 Gifting comm. (25%)</div>
        <div class="font-display text-2xl font-extrabold mt-1">${rupee(giftComm)}</div>
      </div>
    </div>

    <h2 class="font-display text-lg font-bold mb-3">By shop</h2>
    <div class="bg-white rounded-2xl border border-ink-200 overflow-hidden shadow-card overflow-x-auto">
      <table class="w-full text-sm min-w-[600px]">
        <thead class="bg-ink-50 text-ink-500 text-xs uppercase font-bold">
          <tr><th class="text-left px-4 py-2.5">Shop</th><th class="text-right px-4 py-2.5">Orders</th><th class="text-right px-4 py-2.5">GMV</th><th class="text-right px-4 py-2.5">Payout</th><th class="text-right px-4 py-2.5">Commission</th></tr>
        </thead>
        <tbody class="divide-y divide-ink-100">
          ${rows.length===0?`<tr><td colspan="5" class="px-4 py-6 text-center text-ink-500">No data in range.</td></tr>`:
          rows.map(r=>`<tr>
            <td class="px-4 py-3 font-semibold">${r.shop.name}</td>
            <td class="px-4 py-3 text-right">${r.orders}</td>
            <td class="px-4 py-3 text-right">${rupee(r.gmv)}</td>
            <td class="px-4 py-3 text-right">${rupee(r.payout)}</td>
            <td class="px-4 py-3 text-right text-emerald-700 font-bold">${rupee(r.comm)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderAdminQuality(){
  const approved = SHOPS.filter(s=>s.status==='approved').map(s=>{
    const ratings = STATE.orders.filter(o=>o.shopId===s.id && o.rating!=null).map(o=>o.rating);
    const avg = ratings.length? ratings.reduce((a,b)=>a+b,0)/ratings.length : null;
    s.avgRating = avg;
    return {...s, ratingsCount:ratings.length};
  }).sort((a,b)=> (a.avgRating||0)-(b.avgRating||0));
  return `
    <h1 class="font-display text-2xl font-extrabold mb-1">Shop quality</h1>
    <p class="text-sm text-ink-500 mb-5">Monitor customer ratings. Shops below <b>3.5★</b> are flagged and may need training or suspension.</p>

    <div class="grid md:grid-cols-2 gap-3">
      ${approved.map(s=>{
        const flagged = s.avgRating!=null && s.avgRating<3.5;
        return `<div class="bg-white rounded-2xl border ${flagged?'border-red-300 ring-2 ring-red-100':'border-ink-200'} p-4 shadow-card relative overflow-hidden">
          ${flagged?`<div class="absolute top-3 right-3 bg-red-100 text-red-700 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-full">⚠ Flagged</div>`:''}
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 rounded-xl ${flagged?'bg-red-100 text-red-700':'bg-emerald-100 text-emerald-700'} grid place-items-center text-xl">🏪</div>
            <div class="flex-1 min-w-0">
              <div class="font-bold text-ink-900">${s.name}</div>
              <div class="text-xs text-ink-500">${s.categories.map(c=>c==='print'?'🖨️ Print':'🎁 Gifting').join(' · ')}</div>
              <div class="mt-2 flex items-center gap-1 text-2xl ${flagged?'text-red-500':'text-amber-400'}">
                ${[1,2,3,4,5].map(n=>`<span>${(s.avgRating||0)>=n?'★':(s.avgRating||0)>=n-0.5?'☆':'☆'}</span>`).join('')}
                <span class="text-sm font-bold text-ink-900 ml-2">${s.avgRating?s.avgRating.toFixed(1):'—'}</span>
              </div>
              <div class="text-xs text-ink-500 mt-1">${s.ratingsCount} rating${s.ratingsCount===1?'':'s'}</div>
              ${flagged?`<div class="mt-3 p-2 rounded-lg bg-red-50 text-red-800 text-xs">
                Customer satisfaction dropped below threshold. Consider pausing new orders and reaching out.
              </div>`:''}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function bindAdmin(){
  document.querySelectorAll('.a-tab').forEach(t=>t.addEventListener('click',()=>{ ADMIN_TAB=t.dataset.atab; render(); }));
  const lo = document.getElementById('a-logout'); if(lo) lo.addEventListener('click',logout);
  document.querySelectorAll('.a-aprv').forEach(b=>b.addEventListener('click',()=>{
    const s = shopById(b.dataset.approve); s.status='approved'; toast(`${s.name} approved`,'success'); render();
  }));
  document.querySelectorAll('.a-rej').forEach(b=>b.addEventListener('click',()=>{
    const s = shopById(b.dataset.reject); s.status='suspended'; toast(`${s.name} rejected`,'error'); render();
  }));
  document.querySelectorAll('.a-sus').forEach(b=>b.addEventListener('click',()=>{
    const s = shopById(b.dataset.suspend); s.status='suspended'; toast(`${s.name} suspended`,'error'); render();
  }));

  // orders filters
  const fs = document.getElementById('f-status'); if(fs) fs.addEventListener('change',e=>{ ADMIN_FILTERS.status=e.target.value; render();});
  const fsh = document.getElementById('f-shop'); if(fsh) fsh.addEventListener('change',e=>{ ADMIN_FILTERS.shopId=e.target.value; render();});
  const ff = document.getElementById('f-from'); if(ff) ff.addEventListener('change',e=>{ ADMIN_FILTERS.from=e.target.value; render();});
  const ft = document.getElementById('f-to'); if(ft) ft.addEventListener('change',e=>{ ADMIN_FILTERS.to=e.target.value; render();});
  const fc = document.getElementById('f-clear'); if(fc) fc.addEventListener('click',()=>{ ADMIN_FILTERS={status:'all',shopId:'all',from:'',to:''}; render();});

  // assign
  document.querySelectorAll('.assign-go').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.assignGo;
    const sel = document.querySelector(`select[data-assign="${id}"]`);
    const sid = sel.value;
    if(!sid){ toast('Pick a shop first','error'); return; }
    const o = STATE.orders.find(x=>x.id===id);
    o.shopId = sid; o.status='assigned';
    toast(`Assigned to ${shopById(sid).name}`,'success');
    render();
  }));

  // commission date range
  const cApply = document.getElementById('c-apply');
  if(cApply) cApply.addEventListener('click',()=>{
    ADMIN_FILTERS.from = document.getElementById('c-from').value;
    ADMIN_FILTERS.to   = document.getElementById('c-to').value;
    render();
  });
}

  // nothing persistent; just ensure variety
})();

// Kickoff
render();
</script>
